<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tab栏切换</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .tab {
      width: 590px;
      height: 340px;
      margin: 20px;
      border: 1px solid #e4e4e4;
    }

    .tab-nav {
      width: 100%;
      height: 60px;
      line-height: 60px;
      display: flex;
      justify-content: space-between;
    }

    .tab-nav h3 {
      font-size: 24px;
      font-weight: normal;
      margin-left: 20px;
    }

    .tab-nav ul {
      list-style: none;
      display: flex;
      justify-content: flex-end;
    }

    .tab-nav ul li {
      margin: 0 20px;
      font-size: 14px;
    }

    .tab-nav ul li a {
      text-decoration: none;
      border-bottom: 2px solid transparent;
      color: #333;
    }

    .tab-nav ul li a.active {
      border-color: #e1251b;
      color: #e1251b;
    }

    .tab-content {
      padding: 0 16px;
      height: 280px;
      overflow: hidden;
    }



    .tab-content .item.active {
      display: block;
    }

    .tab-content .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div class="tab">
    <div class="tab-nav">
      <h3>每日特价</h3>
      <ul>
        <li><a class="active" href="javascript:;" data-id="0">精选</a></li>
        <li><a href="javascript:;" data-id="1">美食</a></li>
        <li><a href="javascript:;" data-id="2">百货</a></li>
        <li><a href="javascript:;" data-id="3">个护</a></li>
        <li><a href="javascript:;" data-id="4">预告</a></li>
      </ul>
    </div>
    <div class="tab-content">
      <div class="item active" data-id="0"><img src="/照片素材/屏幕截图 2026-03-21 173006.png" alt="" /></div>
      <div class="item" data-id="1"><img src="/照片素材/屏幕截图 2026-04-14 225857.png" alt="" /></div>
      <div class="item" data-id="2"><img src="/照片素材/屏幕截图 2026-04-14 225858.png" alt="" /></div>
      <div class="item" data-id="3"><img src="/照片素材/屏幕截图 2026-04-14 225859.png" alt="" /></div>
      <div class="item" data-id="4"><img src="/照片素材/屏幕截图 2026-04-14 225860.png" alt="" /></div>
    </div>
  </div>
  <script>
    const ul = document.querySelector('.tab-nav ul');
    ul.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') {
        document.querySelector('.tab-nav .active').classList.remove('active');
        e.target.classList.add('active');

        // 切换对应内容
        const id = e.target.dataset.id
        document.querySelector(`.tab-content .active`).classList.remove('active');
      }
    });
  </script>
</body>

</html>
